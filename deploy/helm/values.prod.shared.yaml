# Shared-runtime values contract for a future ERP Helm chart.

global:
  namespace: erp-system
  sharedNamespace: shared-infra

image:
  repository: registry.example.com/erp/erp-app
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: erp.example.com

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

env:
  SERVER_PORT: "8080"
  ERP_DATASOURCE_URL: jdbc:postgresql://postgres.shared-infra.svc.cluster.local:5432/erp
  ERP_DATASOURCE_USERNAME: erp_app
  ERP_DATASOURCE_DRIVER: org.postgresql.Driver
  ERP_REDIS_HOST: redis.shared-infra.svc.cluster.local
  ERP_REDIS_PORT: "6379"
  ERP_REDIS_DATABASE: "1"
  ERP_KAFKA_BOOTSTRAP_SERVERS: kafka.shared-infra.svc.cluster.local:9092
  ERP_KAFKA_TOPIC: erp.domain.events
  ERP_MINIO_ENDPOINT: http://minio.shared-infra.svc.cluster.local:9000
  ERP_MINIO_ACCESS_KEY: minioadmin
  ERP_MINIO_BUCKET: erp-files
  ERP_ES_HOST: elasticsearch.shared-infra.svc.cluster.local
  ERP_ES_PORT: "9200"
  NACOS_ADDR: nacos.shared-infra.svc.cluster.local:8848
  SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"

secretRefs:
  - name: erp-shared-runtime-secrets

sharedDependencies:
  postgres: postgres.shared-infra.svc.cluster.local:5432
  redis: redis.shared-infra.svc.cluster.local:6379
  kafka: kafka.shared-infra.svc.cluster.local:9092
  minio: http://minio.shared-infra.svc.cluster.local:9000
  elasticsearch: http://elasticsearch.shared-infra.svc.cluster.local:9200
  nacos: nacos.shared-infra.svc.cluster.local:8848
